# Apenas o PostgreSQL. API e web rodam com `npm run dev` (ver README).
# As credenciais abaixo são de DESENVOLVIMENTO LOCAL; em produção use um secrets manager.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nobre
      POSTGRES_PASSWORD: nobre
      POSTGRES_DB: nobre_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nobre -d nobre_crm"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
