
services:
  - type: web
    name: nobre-crm-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start      
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false               
      - key: CORS_ORIGINS
        sync: false                
      - key: REFERENCE_DATE
        value: "2026-10-15"       
      - key: TRUST_PROXY
        value: "true"
      - key: NODE_VERSION
        value: "22"
